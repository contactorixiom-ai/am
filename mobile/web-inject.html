<script>
(function(){
  try { window.__nativeFetch = window.fetch.bind(window); } catch(e) { window.__nativeFetch = window.fetch; }
  window.__nativeFetchReady = true;
  if (navigator && navigator.serviceWorker) {
    try { navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try { r.unregister(); } catch(e){} }); }).catch(function(){}); } catch(e) {}
  }
  if (typeof caches !== 'undefined' && caches.keys) {
    try { caches.keys().then(function(names){ names.forEach(function(n){ try { caches.delete(n); } catch(e){} }); }).catch(function(){}); } catch(e) {}
  }
})();
</script>
