<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<style>
  #__axis_err { position: fixed; top: 0; left: 0; right: 0; z-index: 99999; padding: 14px 16px; background: #C0524B; color: #fff; font: 13px/1.4 -apple-system, system-ui, sans-serif; max-height: 60vh; overflow: auto; white-space: pre-wrap; display: none; }
  #__axis_err strong { color: #FFD; }
  #__axis_ok { position: fixed; bottom: 0; left: 0; right: 0; z-index: 99998; padding: 6px 10px; background: #1B7A48; color: #fff; font: 11px -apple-system, system-ui, sans-serif; text-align: center; }
</style>
<script>
(function(){
  try { window.__nativeFetch = window.fetch.bind(window); } catch(e) { window.__nativeFetch = window.fetch; }
  window.__nativeFetchReady = true;
  if (navigator && navigator.serviceWorker) {
    try { navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try { r.unregister(); } catch(e){} }); }).catch(function(){}); } catch(e) {}
  }
  if (typeof caches !== 'undefined' && caches.keys) {
    try { caches.keys().then(function(names){ names.forEach(function(n){ try { caches.delete(n); } catch(e){} }); }).catch(function(){}); } catch(e) {}
  }
  function showErr(label, msg) {
    var el = document.getElementById('__axis_err');
    if (!el) { el = document.createElement('div'); el.id = '__axis_err'; (document.body || document.documentElement).appendChild(el); }
    el.style.display = 'block';
    el.innerHTML += '<strong>' + label + '</strong>: ' + String(msg).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '\n\n';
  }
  window.addEventListener('error', function(e){
    var src = e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno : '';
    showErr('JS Error', (e.message || 'unknown') + src);
  });
  window.addEventListener('unhandledrejection', function(e){
    showErr('Rejection', (e.reason && (e.reason.stack || e.reason.message || e.reason)) || 'unknown');
  });
  // Marqueur de build pour confirmer qu'on charge bien la NOUVELLE version.
  var ok = document.createElement('div');
  ok.id = '__axis_ok';
  ok.textContent = 'Build BUILDSTAMP';
  window.addEventListener('DOMContentLoaded', function(){ (document.body||document.documentElement).appendChild(ok); });
  setTimeout(function(){
    var root = document.getElementById('root') || document.body;
    var hasContent = root && root.children && root.children.length > 2;
    if (!hasContent) showErr('Watchdog 15s', 'App non démarrée. Si tu vois ce message, ce n\'est PAS un cache (le nouveau HTML a chargé) mais un crash JS.');
  }, 15000);
})();
</script>
