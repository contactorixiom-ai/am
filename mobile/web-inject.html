<!-- Installation sur l'écran d'accueil.
     Sans ces balises, « Ajouter à l'écran d'accueil » crée un raccourci qui
     rouvre un onglet de navigateur, avec la barre d'adresse et l'icône du
     site. Avec elles, l'app s'ouvre en plein écran, avec son nom et son
     icône, comme une application installée.
     Les chemins sont relatifs : le site est servi sous /am/app/. -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B2545" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- iOS ignore le manifeste : il lui faut ses propres balises. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Axis Import" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script>
(function(){
  try { window.__nativeFetch = window.fetch.bind(window); } catch(e) { window.__nativeFetch = window.fetch; }
  window.__nativeFetchReady = true;
  if (navigator && navigator.serviceWorker) {
    try { navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ try { r.unregister(); } catch(e){} }); }).catch(function(){}); } catch(e) {}
  }
  if (typeof caches !== 'undefined' && caches.keys) {
    try { caches.keys().then(function(names){ names.forEach(function(n){ try { caches.delete(n); } catch(e){} }); }).catch(function(){}); } catch(e) {}
  }
})();
</script>
