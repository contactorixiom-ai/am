name: Deploy design prototype to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/axis-import-platform-4egTH
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./design
          publish_branch: gh-pages
          commit_message: "Deploy design prototype from ${{ github.sha }}"
