name: Deploy design prototype + mobile web preview to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/axis-import-platform-4egTH
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      - name: Build mobile web bundle
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'http://localhost:3000/api/v1' }}
        run: npx expo export --platform web

      - name: Assemble Pages site
        run: |
          mkdir -p public
          cp -R design/* public/
          mkdir -p public/app
          cp -R mobile/dist/* public/app/
          # Force a content change on every build so peaceiris always pushes
          # and GitHub's pages-build-deployment workflow is triggered.
          echo "Build ${{ github.sha }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/.build-stamp

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy design + mobile web from ${{ github.sha }}"
