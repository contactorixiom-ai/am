name: Deploy design prototype + mobile web preview to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/axis-import-platform-4egTH
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      - name: Build mobile web bundle
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'http://localhost:3000/api/v1' }}
        run: npx expo export --platform web

      - name: Assemble Pages site
        run: |
          mkdir -p public
          cp -R design/* public/
          mkdir -p public/app
          cp -R mobile/dist/* public/app/

          # Inject un script qui sauve window.fetch dans window.__nativeFetch
          # AVANT que le bundle Expo charge, et désinscrit tout service worker.
          # On écrit le script dans un fichier puis on l'injecte avec awk
          # (plus robuste que sed/python avec quotes).
          cat > /tmp/inject.js <<'INJECT_SCRIPT_EOF'
<script>
(function(){
  try { window.__nativeFetch = window.fetch.bind(window); } catch(e) { window.__nativeFetch = window.fetch; }
  window.__nativeFetchReady = true;
  if (navigator && navigator.serviceWorker) {
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ r.unregister(); });
    }).catch(function(){});
  }
})();
</script>
INJECT_SCRIPT_EOF

          if [ -f public/app/index.html ]; then
            # awk : à la première ligne contenant <head, on imprime <head...> puis le script
            awk '
              BEGIN { injected = 0 }
              /<head[^>]*>/ && !injected {
                print $0
                while ((getline line < "/tmp/inject.js") > 0) print line
                close("/tmp/inject.js")
                injected = 1
                next
              }
              { print }
            ' public/app/index.html > public/app/index.html.new
            mv public/app/index.html.new public/app/index.html
            echo "=== Injection vérifiée : ==="
            head -20 public/app/index.html
            echo "==========================="
            grep -q "__nativeFetch" public/app/index.html && echo "✓ Script bien injecté" || echo "✗ ÉCHEC injection"
          fi

          # Force a content change on every build so peaceiris always pushes
          # and GitHub's pages-build-deployment workflow is triggered.
          echo "Build ${{ github.sha }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/.build-stamp

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy design + mobile web from ${{ github.sha }}"
