# Configuration Nixpacks pour Railway.
# Node 22 + nettoyage agressif avant npm ci pour éviter le bug EBUSY
# (Railway garde parfois des node_modules d'un build précédent qui
# bloquent npm ci au moment du rmdir de node_modules/.cache).

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = [
  "rm -rf node_modules /tmp/.npm-cache",
  "mkdir -p /tmp/.npm-cache",
  "npm config set cache /tmp/.npm-cache",
  "npm install --no-audit --no-fund --prefer-offline"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "npx prisma migrate deploy && node dist/main"
