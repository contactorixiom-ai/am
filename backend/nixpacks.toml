# Configuration Nixpacks pour Railway.
# Note : Node 22 évite à la fois le warning EBADENGINE (eslint-visitor-keys
# veut >= 20.19) et le bug EBUSY sur rmdir node_modules/.cache observé
# sur Node 20.18.

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = [
  "npm config set cache /tmp/.npm-cache",
  "npm ci --no-audit --no-fund --prefer-offline"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
cmd = "npx prisma migrate deploy && node dist/main"
